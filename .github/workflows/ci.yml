name: CI

# Contrôle qualité à chaque push et pull request : typecheck, lint et build
# complet contre une base Postgres éphémère (comme en production).
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: akil
          POSTGRES_PASSWORD: akil
          POSTGRES_DB: akil
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://akil:akil@localhost:5432/akil
      NEXTAUTH_SECRET: ci-only-dummy-secret-000000000000000000000000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema (schéma courant, base éphémère)
        # `db push` matérialise l'état de schema.prisma sur la base de CI.
        # (On n'utilise pas `migrate deploy` ici : l'historique de migrations
        # n'est pas rejouable de zéro — voir la tâche « baseline Prisma ».)
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build
